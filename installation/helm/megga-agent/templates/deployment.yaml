{{- if not (or .Values.existingSecret .Values.extraEnv) }}{{ fail "existingSecret, ou extraEnv avec des <NOM>_FILE : les secrets du client (voir values.yaml)" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "megga-agent.nom" . }}
  labels: {{- include "megga-agent.etiquettes" . | nindent 4 }}
spec:
  # Un seul agent à la fois : les messages d'une personne se regroupent dans sa mémoire,
  # et deux agents répondraient deux fois. Une mise à jour arrête l'ancien avant le nouveau.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "megga-agent.etiquettes" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "megga-agent.etiquettes" . | nindent 8 }}
      annotations:
        # Une configuration changée redémarre l'agent, qui la relit au démarrage.
        megga.ai/config: {{ include "megga-agent.config" . | sha256sum | trunc 16 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # À l'arrêt (SIGTERM), l'agent finit ses tours en cours, 100 secondes au plus ;
      # Kubernetes attend 120 secondes avant de le forcer.
      terminationGracePeriodSeconds: 120
      containers:
        - name: agent
          image: {{ include "megga-agent.image" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: MEGGA_INSTALLATION, value: client}
            - {name: CLIENT_CONFIG_FILE, value: /config/client.yaml}
            # Le même réglage que le pilote : avec « non », l'agent sert toujours sa configuration.
            - {name: PILOTAGE, value: {{ .Values.pilotage.mode | toString | quote }}}
            # Le disque de l'image est en lecture seule : le reste s'écrit dans /tmp.
            - {name: HOME, value: /tmp}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /sante, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /sante, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "megga-agent.nom" . }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
