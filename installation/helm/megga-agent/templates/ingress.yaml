{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}{{ fail "ingress.host : le nom de domaine public du webhook" }}{{ end }}
{{- if not (or .Values.ingress.tlsSecret .Values.ingress.tlsAilleurs) }}{{ fail "ingress.tlsSecret : Meta exige HTTPS (ou ingress.tlsAilleurs si un répartiteur de charge s'en charge)" }}{{ end }}
# Exposés en HTTPS : le webhook de Meta et l'entrée par API des logiciels du client (docs/api.md) ;
# /sante et les routes internes restent dans le cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "megga-agent.nom" . }}
  labels: {{- include "megga-agent.etiquettes" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /whatsapp
            pathType: Exact
            backend:
              service:
                name: {{ include "megga-agent.nom" . }}
                port: {name: http}
          - path: /api/messages
            pathType: Exact
            backend:
              service:
                name: {{ include "megga-agent.nom" . }}
                port: {name: http}
          - path: /site/bien
            pathType: Exact
            backend:
              service:
                name: {{ include "megga-agent.nom" . }}
                port: {name: http}
          - path: /site/demande
            pathType: Exact
            backend:
              service:
                name: {{ include "megga-agent.nom" . }}
                port: {name: http}
{{- end }}
