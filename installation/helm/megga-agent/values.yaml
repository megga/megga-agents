# L'agent MEGGA d'un client. Rien de secret ici : les secrets sont dans un Secret du client
# (créé par lui, ou par son coffre : External Secrets, Vault, Key Vault...).

image:
  # L'image signée par MEGGA, par son empreinte (scripts/verifier_image.sh).
  repository: ghcr.io/megga/megga-agents
  digest: ""          # sha256:...  (de préférence)
  tag: ""             # sinon, la version publiée
  pullSecrets: []     # l'accès au registre privé de MEGGA, s'il le faut

# Les secrets du client, au choix :
# - existingSecret : un Secret avec ces clés, remises en variables : DATABASE_URL, MEGGA_LICENCE,
#   META_TOKEN, META_APP_SECRET, META_VERIFY_TOKEN, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY,
#   et ELEVENLABS_API_KEY (facultative) ;
# - des fichiers montés par son coffre (pilote CSI de Vault, Key Vault...) : le volume dans
#   extraVolumes et extraVolumeMounts, et chaque secret dans extraEnv sous la forme <NOM>_FILE.
existingSecret: ""
extraEnv: []
#   - {name: ANTHROPIC_API_KEY_FILE, value: /mnt/secrets/anthropic}
extraVolumes: []
extraVolumeMounts: []

# La configuration de l'agent (noyau/config.py), telle quelle : en valeurs, ou par
# --set-file config=client.yaml.
config: {}

ingress:
  enabled: true
  className: ""
  host: ""            # le nom de domaine public du webhook
  tlsSecret: ""       # le certificat HTTPS de ce domaine (Meta exige HTTPS)
  tlsAilleurs: false  # vrai si un répartiteur de charge assure HTTPS devant l'ingress
  annotations: {}

resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {memory: 1Gi}

# Le pilotage par MEGGA (docs/installation-client.md, « Le pilotage ») : un petit pilote à côté de
# l'agent, la même image, toujours sortant (aucun port, aucun accès entrant).
pilotage:
  mode: non           # non (rien ne sort), suivi (état, volumes, coûts, alertes ; jamais une
                      # conversation) ou complet (et MEGGA peut changer la configuration de l'agent)
  accord: true        # chaque changement venu de MEGGA attend l'accord du client
  # true : le pilote installe les versions d'image acceptées (signature vérifiée, base sauvegardée,
  # retour arrière si l'agent ne répond plus). Il reçoit un compte de service qui ne peut changer que
  # l'image de l'agent et la sienne. false : le client met à jour image.digest lui-même.
  misesAJour: false
  delai: 600          # les secondes laissées à l'agent pour répondre sur une nouvelle configuration ou image
  sauvegardes:        # avec misesAJour : les 3 dernières sauvegardes de la base, dans un volume
    taille: 5Gi
    storageClass: ""
    existingClaim: ""
  url: https://megga-agents.api-963.workers.dev
  # La clé de l'installation (PILOTE_CLE), créée chez le client, au choix :
  # - secret : un Secret avec la clé PILOTE_CLE (l'adresse de la base vient de existingSecret) ;
  # - des fichiers montés par son coffre : extraVolumes, extraVolumeMounts, et dans extraEnv
  #   PILOTE_CLE_FILE (et DATABASE_URL_FILE sans existingSecret).
  # Le même Secret peut porter REGISTRE_COMPTE et REGISTRE_JETON : la lecture du registre, pour la signature.
  # Le pilote ne reçoit ni les clés des modèles ni celles de Meta.
  secret: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

nodeSelector: {}
tolerations: []
