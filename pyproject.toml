[project]
name = "megga-agents"
version = "0.3.0"
description = "Le noyau des agents MEGGA, sur Agno."
requires-python = ">=3.12"
dependencies = [
  "agno==3.2.0",
  "anthropic==2.8.0",
  "openai==3.51.0",
  "fastapi==0.163.1",
  # Pour l'API d'AgentOS (JWT_VERIFICATION_KEY) : sa garde par jeton et ses formulaires.
  "pyjwt==2.15.1",
  "python-multipart==0.0.33",
  "uvicorn==0.54.0",
  "sqlalchemy[asyncio]==2.1.8",
  # Des versions exactes : l'image signée ne dépend pas du jour où elle est construite.
  "psycopg[binary]==3.3.9",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  # La base de connaissances (noyau/connaissances.py) : le modèle de recherche, et la lecture des PDF.
  "onnxruntime==1.32.0",
  "tokenizers==0.23.3",
  "numpy==2.5.5",
  "pypdf==7.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["noyau", "atelier", "pilote", "packs", "packs.immobilier"]

[tool.setuptools.package-data]
"packs.immobilier" = ["demo/*.json"]
# Les clés publiques des licences, du pilotage et des images (scripts/licence.py cle, scripts/pilotage.py cle,
# scripts/cle_signature.sh, copiée de socle/cosign.pub à la construction), quand elles existent.
"noyau" = ["licence.pub", "pilotage.pub", "cosign.pub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
