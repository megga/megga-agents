[project]
name = "megga-agents"
version = "0.3.0"
description = "Le noyau des agents MEGGA, sur Agno."
requires-python = ">=3.12"
dependencies = [
  "agno==3.2.0",
  "anthropic==2.8.0",
  "openai>=1.0",
  "fastapi==0.163.1",
  # Pour l'API d'AgentOS (JWT_VERIFICATION_KEY) : sa garde par jeton et ses formulaires.
  "pyjwt==2.15.1",
  "python-multipart==0.0.33",
  "uvicorn>=0.30",
  "sqlalchemy[asyncio]==2.1.8",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "httpx>=0.27",
  "cryptography>=43",
  # La base de connaissances (noyau/connaissances.py) : le modèle de recherche, et la lecture des PDF.
  "onnxruntime==1.32.0",
  "tokenizers==0.23.3",
  "numpy>=2",
  "pypdf==7.1.0",
  # Les connecteurs MCP du client (noyau/connecteurs.py) : le client MCP d'Agno demande les deux.
  "mcp==2.3.0",
  "fastmcp==4.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["noyau", "atelier", "pilote", "packs", "packs.immobilier"]

[tool.setuptools.package-data]
"packs.immobilier" = ["demo/*.json"]
# Les clés publiques des licences, du pilotage et des images (scripts/licence.py cle, scripts/pilotage.py cle,
# scripts/cle_signature.sh, copiée de socle/cosign.pub à la construction), quand elles existent.
"noyau" = ["licence.pub", "pilotage.pub", "cosign.pub", "banc/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
