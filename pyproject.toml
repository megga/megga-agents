[project]
name = "megga-agents"
version = "0.2.0"
description = "Le noyau des agents MEGGA, sur Agno."
requires-python = ">=3.12"
dependencies = [
  "agno==3.2.0",
  "anthropic==2.8.0",
  "openai>=1.0",
  "fastapi==0.163.1",
  "uvicorn>=0.30",
  "sqlalchemy[asyncio]==2.1.8",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "httpx>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["noyau", "atelier", "pilote", "packs", "packs.immobilier"]

[tool.setuptools.package-data]
"packs.immobilier" = ["demo/*.json"]
# Les clés publiques des licences, du pilotage et des images (scripts/licence.py cle, scripts/pilotage.py cle,
# scripts/cle_signature.sh, copiée de socle/cosign.pub à la construction), quand elles existent.
"noyau" = ["licence.pub", "pilotage.pub", "cosign.pub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
