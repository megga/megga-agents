name: publier

# Construit l'image une seule fois, la publie dans le registre de MEGGA et la signe. Le numéro
# de version n'est posé qu'à la fin, sur une image essayée, signée et vérifiée.
# Seulement à la main, depuis main, en écrivant « Publie ». Une version publiée ne se republie
# pas : pour publier, changer la version dans pyproject.toml (docs/deploiement.md).
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Écrire : Publie"
        required: true

permissions:
  contents: read
  packages: write

env:
  # Le registre privé de MEGGA (GitHub). Cloudflare ne tire pas d'ici : il reçoit une copie
  # de la même image (scripts/vers_cloudflare.sh).
  IMAGE: ghcr.io/megga/megga-agents

# Une publication à la fois : deux lancements ne déplacent jamais le même numéro de version.
concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    if: ${{ github.event.inputs.confirmation == 'Publie' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: La version (pyproject.toml)
        id: v
        run: |
          echo "version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: La clé publique est dans le dépôt
        run: |
          test -s socle/cosign.pub || { echo "socle/cosign.pub absente : lancer scripts/cle_signature.sh"; exit 1; }
          # Les clés des licences et des ordres de pilotage : sans elles, l'image ne démarre pas chez un client (I21).
          test -s noyau/licence.pub || { echo "noyau/licence.pub absente : lancer scripts/licence.py cle"; exit 1; }
          test -s noyau/pilotage.pub || { echo "noyau/pilotage.pub absente : lancer scripts/pilotage.py cle"; exit 1; }

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Une version publiée ne se republie pas
        run: |
          # Seule une réponse « introuvable » laisse passer ; une panne du registre arrête tout,
          # pour qu'un numéro déjà publié ne soit jamais déplacé sur une autre image.
          if sortie=$(docker buildx imagetools inspect "$IMAGE:${{ steps.v.outputs.version }}" 2>&1); then
            echo "la version ${{ steps.v.outputs.version }} est déjà publiée : changer pyproject.toml"; exit 1
          fi
          if ! printf '%s' "$sortie" | grep -qiE "not found|manifest unknown|name unknown|denied|404"; then
            echo "registre injoignable, on n'ose pas publier : $sortie"; exit 1
          fi

      - name: Construire et publier, par empreinte seule
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: socle/Dockerfile
          platforms: linux/amd64
          # Sans numéro de version tant qu'elle n'est ni essayée, ni signée, ni vérifiée.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Un seul manifeste : la copie chez Cloudflare garde la même empreinte.
          provenance: false
          sbom: false
          build-args: |
            MEGGA_VERSION=${{ steps.v.outputs.version }}
            MEGGA_REVISION=${{ github.sha }}

      - name: L'image démarre et dit sa version
        run: |
          REF="$IMAGE@${{ steps.image.outputs.digest }}"
          docker run -d --name essai -p 8080:8080 -e MEGGA_SERVICE=atelier \
            -e DATABASE_URL=sqlite:////tmp/a.db -e ADMIN_TOKEN=essai "$REF"
          for i in $(seq 1 30); do
            if curl -sf localhost:8080/sante | grep -q '"version":"${{ steps.v.outputs.version }}"'; then exit 0; fi
            sleep 1
          done
          docker logs essai; exit 1

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v2.4.1"

      - name: Signer
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        # Sans journal public : le dépôt est privé, rien n'en sort.
        run: |
          cosign sign --yes --key env://COSIGN_KEY --tlog-upload=false "$IMAGE@${{ steps.image.outputs.digest }}"

      - name: Vérifier avec la clé publique du dépôt
        run: |
          cosign verify --key socle/cosign.pub --insecure-ignore-tlog=true "$IMAGE@${{ steps.image.outputs.digest }}" > /dev/null

      - name: Poser le numéro de version, sur la même empreinte
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:${{ steps.v.outputs.version }}" "$IMAGE@${{ steps.image.outputs.digest }}"
          pose=$(docker buildx imagetools inspect "$IMAGE:${{ steps.v.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$pose" = "${{ steps.image.outputs.digest }}" || { echo "empreinte changée en posant le numéro : $pose"; exit 1; }

      - name: Résumé
        run: |
          {
            echo "### megga-agents ${{ steps.v.outputs.version }}"
            echo ""
            echo "- image : \`$IMAGE@${{ steps.image.outputs.digest }}\`"
            echo "- commit : \`${{ github.sha }}\`"
            echo "- signée, vérifiée avec \`socle/cosign.pub\`"
          } >> "$GITHUB_STEP_SUMMARY"
