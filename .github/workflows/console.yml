name: console

# La console MEGGA (console/) : à part de tests.yml, que d'autres lots modifient.
# L'atelier d'essai de l'admin (console/agents/atelier_essai.py) lance le vrai atelier, lit le noyau, les gabarits (packs/) et les dépendances Python (pyproject.toml) : leurs changements la relancent.
on:
  pull_request:
    paths: ["console/**", "atelier/**", "noyau/**", "packs/**", "pyproject.toml", ".github/workflows/console.yml"]
  push:
    branches: [main]
    paths: ["console/**", "atelier/**", "noyau/**", "packs/**", "pyproject.toml", ".github/workflows/console.yml"]

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    # Postgres, le moteur de la production : les essais y rejouent toute la suite, les parcours y tournent.
    services:
      postgres:
        image: postgres:18@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: console
    env:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Le serveur d'agents de l'essai lit les gabarits et le noyau, sans les modifier.
      - run: uv venv --python 3.12 && uv pip install -e ".[test]" "ag-ui-protocol==1.0.0"
        working-directory: .
      - run: ../.venv/bin/python -m pytest -q agents
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Les essais sur SQLite, puis les mêmes sur Postgres (chaque essai y crée sa base, puis la supprime).
      - run: npm test
      - run: npm test
        env:
          CONSOLE_ESSAI_MOTEUR: postgres
          CONSOLE_BASE_ESSAI_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npx playwright install --with-deps chromium
      # Les parcours sur Postgres : la console et la commande admin:inviter lisent CONSOLE_BASE_URL.
      - run: npm run test:e2e
        env:
          CONSOLE_BASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # À l'échec d'un parcours : ce que l'écran montrait (l'instantané de Playwright), pour ne pas deviner.
      - if: failure()
        run: find test-results -name error-context.md -exec sh -c 'echo "=== $1"; sed -n "/^# Page snapshot/,/^# Test source/p" "$1"' _ {} \; 2>/dev/null || true

  # L'image de la console (console/Dockerfile), celle que le conteneur du Worker megga-console construit : elle se construit,
  # démarre sans base Postgres ni serveur d'agents, et répond sur /api/sante (ce que le Worker attend) et sur /connexion.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f console/Dockerfile --build-arg CONSOLE_REVISION=${{ github.sha }} -t megga-console:essai console
      - name: Le conteneur démarre et répond à /api/sante et à /connexion
        run: |
          docker run -d --name console -p 3300:3000 -e BETTER_AUTH_SECRET=secret-de-la-ci-qui-ne-sert-qu-ici-et-nulle-part-ailleurs \
            -e BETTER_AUTH_URL=http://localhost:3300 megga-console:essai
          for i in $(seq 1 60); do curl -sf localhost:3300/api/sante >/dev/null && break; sleep 1; done
          SANTE=$(curl -sf localhost:3300/api/sante) || { docker logs console; exit 1; }
          echo "$SANTE"
          test "$SANTE" = '{"ok":true,"revision":"${{ github.sha }}"}' || { docker logs console; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3300/connexion)" = 200 || { docker logs console; exit 1; }
          test "$(docker inspect -f '{{.Config.User}}' megga-console:essai)" = node

  # Le Worker megga-console (console/hebergement) : ses essais (un faux conteneur, secrets.sh avec un faux wrangler), puis
  # sa configuration lue par wrangler, sans rien déployer.
  hebergement:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/hebergement
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --containers-rollout=none --outdir /tmp/console
