name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  noyau:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: essai
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:essai@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[test]"
      - run: .venv/bin/python -m pytest -q

  porte:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --containers-rollout=none --outdir /tmp/porte

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f socle/Dockerfile --build-arg MEGGA_REVISION=${{ github.sha }} -t megga-agents:essai .
      - name: Le conteneur démarre et répond à /sante, disque en lecture seule (comme le chart Helm)
        run: |
          CONF=$(docker run --rm -i megga-agents:essai python -c "import sys,json,yaml;print(json.dumps(yaml.safe_load(sys.stdin)))" < clients/exemple.yaml)
          docker run -d --name essai -p 8080:8080 --read-only --tmpfs /tmp -e HOME=/tmp -e CLIENT_CONFIG="$CONF" \
            -e DATABASE_URL=sqlite:////tmp/essai.db -e META_APP_SECRET=essai megga-agents:essai
          for i in $(seq 1 30); do curl -sf localhost:8080/sante && exit 0; sleep 1; done
          docker logs essai; exit 1
      - name: Un tour complet sur disque en lecture seule (base, journal, fil)
        run: |
          CORPS=$(python3 -c "import json,time;print(json.dumps({'object':'whatsapp_business_account','entry':[{'changes':[{'field':'messages','value':{'metadata':{'phone_number_id':'100000000000001'},'messages':[{'from':'41790000000','id':'w1','type':'text','timestamp':str(int(time.time())),'text':{'body':'Bonjour'}}]}}]}]}))")
          SIG=$(printf %s "$CORPS" | openssl dgst -sha256 -hmac essai | sed 's/^.* //')
          curl -sf -X POST localhost:8080/whatsapp -H "x-hub-signature-256: sha256=$SIG" -H "content-type: application/json" --data-binary "$CORPS"
          sleep 10
          docker logs essai 2>&1 | tail -20
          # le tour échoue faute de clé de modèle, mais rien ne doit avoir voulu écrire sur le disque
          if docker logs essai 2>&1 | grep -qi "read-only file system"; then exit 1; fi
          test "$(docker inspect -f '{{.State.Running}}' essai)" = true
      - name: La même image démarre en atelier
        run: |
          docker run -d --name atelier -p 8081:8080 --read-only --tmpfs /tmp -e HOME=/tmp -e MEGGA_SERVICE=atelier \
            -e DATABASE_URL=sqlite:////tmp/atelier.db -e ADMIN_TOKEN=essai megga-agents:essai
          for i in $(seq 1 30); do
            if curl -sf localhost:8081/sante | grep -q '"revision":"${{ github.sha }}"'; then
              curl -sf -H "authorization: Bearer essai" localhost:8081/atelier/catalogue && exit 0
            fi
            sleep 1
          done
          docker logs atelier; exit 1
      - name: La même image en pilote, disque en lecture seule ; sans sa clé, il ne démarre pas
        run: |
          CONF=$(docker run --rm -i megga-agents:essai python -c "import sys,json,yaml;print(json.dumps(yaml.safe_load(sys.stdin)))" < clients/exemple.yaml)
          docker run -d --name pilote --read-only --tmpfs /tmp -e HOME=/tmp -e MEGGA_SERVICE=pilote -e CLIENT_CONFIG="$CONF" megga-agents:essai
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' pilote)" = true
          docker exec pilote python -m pilote vivant
          docker logs pilote 2>&1 | grep -q "rien ne sort"
          if docker run --rm -e MEGGA_SERVICE=pilote -e PILOTAGE=suivi -e CLIENT_CONFIG="$CONF" -e DATABASE_URL=sqlite:////tmp/p.db megga-agents:essai; then exit 1; fi

  pilotage:
    # De bout en bout : l'installation Compose du guide, son pilote, et un atelier d'essai à côté.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e .
      - run: .venv/bin/python tests/compose/essai_pilote.py "$RUNNER_TEMP/essai-pilote"

  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Le chart Helm
        run: |
          helm lint installation/helm/megga-agent -f installation/helm/megga-agent/exemple-valeurs.yaml
          helm template essai installation/helm/megga-agent -f installation/helm/megga-agent/exemple-valeurs.yaml > /tmp/rendu.yaml
          grep -q "path: /whatsapp" /tmp/rendu.yaml
          V=installation/helm/megga-agent/exemple-valeurs.yaml
          # la configuration par --set-file, comme dans le guide
          helm template essai installation/helm/megga-agent -f $V --set-file config=clients/exemple.yaml | grep -q "entreprise: Entreprise exemple"
          # les secrets en fichiers (coffre du client), sans Secret Kubernetes : l'agent seul, puis avec son pilote
          helm template essai installation/helm/megga-agent -f $V --set existingSecret= --set pilotage.mode=non \
            --set "extraEnv[0].name=ANTHROPIC_API_KEY_FILE" --set "extraEnv[0].value=/mnt/secrets/anthropic" | grep -q ANTHROPIC_API_KEY_FILE
          helm template essai installation/helm/megga-agent -f $V --set existingSecret= --set pilotage.secret= \
            --set "extraEnv[0].name=DATABASE_URL_FILE" --set "extraEnv[0].value=/mnt/secrets/base" \
            --set "pilotage.extraEnv[0].name=PILOTE_CLE_FILE" --set "pilotage.extraEnv[0].value=/mnt/pilote/cle" \
            --set "pilotage.extraEnv[1].name=DATABASE_URL_FILE" --set "pilotage.extraEnv[1].value=/mnt/pilote/base" > /tmp/fichiers.yaml
          grep -q "value: /mnt/pilote/cle" /tmp/fichiers.yaml
          # sans les valeurs du client, sans HTTPS ou sans secrets, le chart refuse au lieu d'installer un agent incomplet
          if helm template essai installation/helm/megga-agent > /dev/null 2>&1; then echo "rendu sans valeurs"; exit 1; fi
          if helm template essai installation/helm/megga-agent -f $V --set ingress.tlsSecret= > /dev/null 2>&1; then echo "rendu sans HTTPS"; exit 1; fi
          if helm template essai installation/helm/megga-agent -f $V --set existingSecret= > /dev/null 2>&1; then echo "rendu sans secrets"; exit 1; fi
          # le pilote : rendu avec le pilotage, avec ses propres étiquettes ; absent sans ; refusé sans sa clé
          grep -q "name: essai-megga-agent-pilote" /tmp/rendu.yaml
          grep -q "app.kubernetes.io/name: megga-pilote" /tmp/rendu.yaml
          if helm template essai installation/helm/megga-agent -f $V --set pilotage.mode=non | grep -q megga-pilote; then echo "pilote sans pilotage"; exit 1; fi
          if helm template essai installation/helm/megga-agent -f $V --set pilotage.secret= > /dev/null 2>&1; then echo "pilote sans clé"; exit 1; fi
          if helm template essai installation/helm/megga-agent -f $V --set pilotage.mode=tout > /dev/null 2>&1; then echo "pilotage inconnu"; exit 1; fi
      - name: Le Docker Compose
        working-directory: installation/compose
        run: |
          cp exemple.env .env && sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=essai/' .env
          touch secrets.env client.yaml
          docker compose config -q
