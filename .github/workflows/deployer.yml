name: déployer

# Seulement à la main, et seulement si l'on écrit « Fusionne et déploie ».
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Écrire : Fusionne et déploie"
        required: true

permissions:
  contents: read

jobs:
  deployer:
    if: ${{ github.event.inputs.confirmation == 'Fusionne et déploie' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porte
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: L'annuaire est à jour
        run: npx wrangler d1 migrations apply megga-agents-annuaire --remote
      - name: La porte et l'image des agents
        run: npx wrangler deploy
