name: déployer

# Seulement à la main, et seulement si l'on écrit « Fusionne et déploie ».
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Écrire : Fusionne et déploie"
        required: true

permissions:
  contents: read

jobs:
  deployer:
    if: ${{ github.event.inputs.confirmation == 'Fusionne et déploie' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porte
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      # Le jeton de Cloudflare seulement aux deux étapes de wrangler : ni npm ci (scripts d'installation des
      # dépendances) ni les essais ne le voient (relecture du 16.11.2026, I22).
      - name: L'annuaire est à jour
        run: npx wrangler d1 migrations apply megga-agents-annuaire --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: La porte et l'image des agents
        run: npx wrangler deploy --tag "${GITHUB_SHA::12}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
